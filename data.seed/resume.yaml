jobDescriptions:
  - id: "google-staff-infra"
    company: "Google"
    roleTitle: "Staff Software Engineer, Cloud & Distributed Infrastructure"
    rawText: |
      About the job:
      As a Staff Software Engineer on Google Cloud Infrastructure, you will lead technical architecture for large-scale distributed systems powering next-generation cloud services.

      Responsibilities:
      - Design and build planet-scale distributed storage and compute infrastructure.
      - Drive cross-functional technical strategy across multiple platform teams.
      - Optimize service latency, availability, and cost efficiency across distributed clusters.
      - Mentor and grow senior and staff-level engineers.

      Minimum qualifications:
      - Bachelor's degree in Computer Science or equivalent practical experience.
      - 8+ years of experience with distributed systems design in Go, C++, or Rust.
      - Experience with container orchestration (Kubernetes), consensus protocols, or high-throughput messaging (Kafka).
    url: "https://careers.google.com/jobs/results/staff-swe-infra"
    requirements:
      - id: "req-dist-systems"
        text: "Design and build planet-scale distributed storage and compute infrastructure"
        weight: "high"
        tags: ["Distributed Systems", "Architecture", "Performance"]
        orderIndex: 1
      - id: "req-languages"
        text: "8+ years of experience with distributed systems design in Go, C++, or Rust"
        weight: "high"
        tags: ["Go", "Rust", "C++"]
        orderIndex: 2
      - id: "req-k8s"
        text: "Experience with container orchestration (Kubernetes), consensus protocols, or high-throughput messaging"
        weight: "high"
        tags: ["Kubernetes", "Consensus", "Kafka"]
        orderIndex: 3
      - id: "req-leadership"
        text: "Drive cross-functional technical strategy and mentor senior/staff engineers"
        weight: "medium"
        tags: ["Leadership", "Mentorship"]
        orderIndex: 4
